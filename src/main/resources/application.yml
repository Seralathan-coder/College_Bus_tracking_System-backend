server:
  port: 8080

spring:
  application:
    name: college-bus-tracking
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:college_bus_tracking}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:user}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: ${JWT_ACCESS_MINUTES:60}
  refresh-token-days: ${JWT_REFRESH_DAYS:7}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://localhost:19006}

app:
  errors:
    include-details: ${APP_ERRORS_INCLUDE_DETAILS:false}
  seed:
    enabled: ${SEED_DATA:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@college.edu}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.college.bustracking: INFO
