# Equivalent key/value configuration is also maintained in application.yml.
# Spring Boot loads both files; these matching values keep either format usable.
server.port=8080
spring.application.name=college-bus-tracking
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:college_bus_tracking}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:user}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=${JWT_ACCESS_MINUTES:60}
jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://localhost:19006}
app.seed.enabled=${SEED_DATA:true}
app.errors.include-details=${APP_ERRORS_INCLUDE_DETAILS:false}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@college.edu}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
logging.level.com.college.bustracking=INFO
