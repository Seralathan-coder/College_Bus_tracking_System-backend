spring:
  datasource:
    url: jdbc:h2:mem:bustracking;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

jwt:
  secret: test-jwt-secret-key-which-is-long-enough-for-hmac-sha256-algorithms
  access-token-minutes: 60
  refresh-token-days: 7

cors:
  allowed-origins: http://localhost:5173

app:
  seed:
    enabled: false
    admin-email: admin@gmail.com
    admin-password: Admin@123
